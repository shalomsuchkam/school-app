appId: kz.uroki.app
---
- launchApp:
    permissions:
      all: unset
- openLink: "uroki://join?code=${REVIEW_CODE}"
- runFlow:
    when:
      visible: "Open|Открыть"
    commands:
      - tapOn: "Open|Открыть"
- runFlow:
    when:
      visible: ".*(I have a code|У меня есть код).*"
    commands:
      # A first launch can finish hydration after the OS opens the link.
      # Reopen it only when the welcome screen is visibly still active.
      - openLink: "uroki://join?code=${REVIEW_CODE}"
      - runFlow:
          when:
            visible: "Open|Открыть"
          commands:
            - tapOn: "Open|Открыть"
- takeScreenshot: "${OUTPUT}/00-join-debug"
- extendedWaitUntil:
    visible: "Join|Войти"
    timeout: 60000
- tapOn:
    text: "Join|Войти"
- extendedWaitUntil:
    visible: "Open schedule|Открыть расписание"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: "${OUTPUT}/01-parent-home"
- openLink: "uroki://parent/screen"
- extendedWaitUntil:
    visible: "Rules for your child's phone|Правила для телефона ребёнка"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: "${OUTPUT}/02-screen-time"
- openLink: "uroki://parent/calendar"
- extendedWaitUntil:
    visible: "Calendar|Календарь"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: "${OUTPUT}/03-calendar"
- openLink: "uroki://parent/settings"
- extendedWaitUntil:
    visible: "Students|Ученики"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: "${OUTPUT}/04-settings"
