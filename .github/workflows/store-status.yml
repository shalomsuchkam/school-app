name: Store readiness status
on:
  workflow_dispatch:
    inputs:
      configure_family_controls:
        description: Enable already approved Family Controls Distribution for the main app
        type: boolean
        default: false
      prepare_metadata:
        description: Save reviewed Russian App Store description and privacy/support URLs
        type: boolean
        default: false
      release_build:
        description: Link this processed build number to the draft App Store version
        type: string
        default: ''
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Apple app and capability status (no secret values)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CONFIGURE_CONTROLS: ${{ inputs.configure_family_controls }}
          PREPARE_METADATA: ${{ inputs.prepare_metadata }}
          REVIEW_NOTES: ${{ secrets.STORE_REVIEW_NOTES }}
          RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';
          const b64 = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const head = b64({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'});
          const body = b64({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
          const unsigned = `${head}.${body}`;
          const sig = sign('sha256',Buffer.from(unsigned),{key:createPrivateKey(process.env.ASC_KEY_P8),dsaEncoding:'ieee-p1363'}).toString('base64url');
          const token = `${unsigned}.${sig}`;
          console.log(`::add-mask::${token}`);
          async function request(path, method='GET', body) {
            const r = await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body ? {body:JSON.stringify(body)} : {})});
            const data=await r.json();
            if(!r.ok) throw new Error(JSON.stringify({status:r.status,errors:data.errors}));
            return data.data;
          }
          const get=(path)=>request(path);
          const apps = await get('apps?filter[bundleId]=kz.uroki.app');
          for(const app of apps) {
            console.log('APP',JSON.stringify({id:app.id,...app.attributes}));
            const versions=await get(`apps/${app.id}/appStoreVersions?limit=5`);
            console.log('VERSIONS',JSON.stringify(versions.map(x=>({id:x.id,...x.attributes}))));
            const builds=await get(`builds?filter[app]=${app.id}&sort=-uploadedDate&limit=5`);
            console.log('BUILDS',JSON.stringify(builds.map(x=>({id:x.id,version:x.attributes.version,state:x.attributes.processingState}))));
            for(const version of versions) {
              if(process.env.RELEASE_BUILD && version.attributes.appStoreState === 'PREPARE_FOR_SUBMISSION') {
                const build=builds.find(x=>x.attributes.version===process.env.RELEASE_BUILD && x.attributes.processingState==='VALID');
                if(!build) throw new Error('Requested build is not yet VALID: '+process.env.RELEASE_BUILD);
                await request(`appStoreVersions/${version.id}/relationships/build`,'PATCH',{data:{type:'builds',id:build.id}});
                console.log('BUILD_LINKED',process.env.RELEASE_BUILD,version.id);
              }
              if(process.env.PREPARE_METADATA === 'true' && process.env.REVIEW_NOTES && version.attributes.appStoreState === 'PREPARE_FOR_SUBMISSION') {
                let detail;
                try { detail=await get(`appStoreVersions/${version.id}/appStoreReviewDetail`); } catch (e) { if(!e.message.includes('404')) throw e; }
                const attributes={notes:process.env.REVIEW_NOTES,demoAccountRequired:true,demoAccountName:'Invite codes in Notes',demoAccountPassword:'No password; use I have a code'};
                if(detail) await request(`appStoreReviewDetails/${detail.id}`,'PATCH',{data:{type:'appStoreReviewDetails',id:detail.id,attributes}});
                else await request('appStoreReviewDetails','POST',{data:{type:'appStoreReviewDetails',attributes,relationships:{appStoreVersion:{data:{type:'appStoreVersions',id:version.id}}}}});
                console.log('REVIEW_NOTES_SAVED',version.id);
              }
              const locs=await get(`appStoreVersions/${version.id}/appStoreVersionLocalizations`);
              for(const loc of locs) {
                if(process.env.PREPARE_METADATA === 'true' && version.attributes.appStoreState === 'PREPARE_FOR_SUBMISSION' && loc.attributes.locale === 'ru') {
                  const description = '«Контроль ДЗ» помогает семье организовать домашние задания и дела ребёнка. Родитель задаёт расписание, ребёнок отмечает выполненное и прикладывает фотографии работы. Родитель проверяет результат, одобряет или просит переделать.\n\nВ ПРИЛОЖЕНИИ\n• Задания по предметам и домашние дела.\n• Фото, комментарии, чат у задания и голосовые заметки.\n• Календарь прогресса и отчёты.\n• Ссылки на учебники и локальные PDF.\n• Второй родитель и репетитор подключаются одноразовым кодом.\n• Русский, қазақша и English; светлая и тёмная темы.\n\nЭКРАННОЕ ВРЕМЯ\nС iPhone родитель может задавать лимиты на приложения Android-телефона ребёнка, время сна и школьные часы, блокировку до выполнения заданий и дополнительное время. На Android ребёнок отдельно разрешает доступ к статистике и отображение поверх приложений. Контроль работает с постоянным видимым уведомлением. Звонки и сообщения остаются доступны. В этой версии блокировка приложений на iPhone ребёнка не включена.\n\nГДЕ РЕБЁНОК\nРодитель может включить обмен местоположением. После разрешения на устройстве ребёнка приложение передаёт точное местоположение, включая фоновый режим, и недавний маршрут на сервер в Казахстане. Ребёнок видит, что функция включена. Разрешения и обмен местоположением можно отключить.\n\nДОСТУП И КОНФИДЕНЦИАЛЬНОСТЬ\nВход по одноразовому коду семьи, без паролей и электронной почты. Скрытого наблюдения, чтения переписки и рекламного трекинга нет. Удалить семью и её данные можно в настройках. Уведомления зависят от разрешений устройства и подключения к интернету.\n\nУсловия использования: https://urokiapp.kz/terms\nПолитика конфиденциальности: https://urokiapp.kz/privacy\nПоддержка: https://urokiapp.kz/support';
                  await request(`appStoreVersionLocalizations/${loc.id}`,'PATCH',{data:{type:'appStoreVersionLocalizations',id:loc.id,attributes:{description,keywords:'уроки,школа,задания,дневник,расписание,родительский,лимит,телефон,дети,семья',supportUrl:'https://urokiapp.kz/support',marketingUrl:'https://urokiapp.kz'}}});
                  await request(`appStoreVersions/${version.id}`,'PATCH',{data:{type:'appStoreVersions',id:version.id,attributes:{versionString:'1.0.0',copyright:'2026 KonG Service'}}});
                  console.log('METADATA_SAVED',loc.id);
                }
                const sets=await get(`appStoreVersionLocalizations/${loc.id}/appScreenshotSets`);
                console.log('SCREENSHOT_SETS',JSON.stringify(sets.map(x=>({id:x.id,...x.attributes}))));
              }
              console.log('LOCALIZATIONS',JSON.stringify((await get(`appStoreVersions/${version.id}/appStoreVersionLocalizations`)).map(x=>({id:x.id,locale:x.attributes.locale,hasDescription:!!x.attributes.description,supportUrl:x.attributes.supportUrl}))));
            }
            for(const info of await get(`apps/${app.id}/appInfos`)) {
              const locs=await get(`appInfos/${info.id}/appInfoLocalizations`);
              for(const loc of locs) {
                if(process.env.PREPARE_METADATA === 'true' && loc.attributes.locale === 'ru') {
                  await request(`appInfoLocalizations/${loc.id}`,'PATCH',{data:{type:'appInfoLocalizations',id:loc.id,attributes:{name:'Контроль ДЗ',subtitle:'Домашка, дела и экранное время',privacyPolicyUrl:'https://urokiapp.kz/privacy'}}});
                }
              }
              console.log('APP_INFO',JSON.stringify({id:info.id,...info.attributes}));
            }
          }
          if(!apps.length) console.log('NO_APP_STORE_APP');
          const bundles=await get('bundleIds?filter[identifier]=kz.uroki.app,kz.uroki.app.ActivityMonitorExtension,kz.uroki.app.ShieldConfiguration,kz.uroki.app.ShieldAction');
          for(const bundle of bundles) {
            console.log('BUNDLE',JSON.stringify(bundle.attributes));
            let caps=await get(`bundleIds/${bundle.id}/bundleIdCapabilities`);
            if(process.env.CONFIGURE_CONTROLS === 'true' && bundle.attributes.identifier === 'kz.uroki.app' && !caps.some(x=>x.attributes.capabilityType==='FAMILY_CONTROLS_DISTRIBUTION')) {
              await request('bundleIdCapabilities','POST',{data:{type:'bundleIdCapabilities',attributes:{capabilityType:'FAMILY_CONTROLS_DISTRIBUTION'},relationships:{bundleId:{data:{type:'bundleIds',id:bundle.id}}}}});
              caps=await get(`bundleIds/${bundle.id}/bundleIdCapabilities`);
            }
            console.log('CAPABILITIES',JSON.stringify(caps.map(x=>x.attributes)));
          }
          NODE
