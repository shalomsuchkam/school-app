name: Build APK + IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # RevenueCat public SDK keys (safe to ship in the app); purchases are off when unset
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
      # Expo push service project (server push); empty = push off, local reminders still work
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    outputs:
      signing: ${{ steps.apk.outputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Firebase config for push (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          signing=()
          set_count=0
          for v in "$ANDROID_KEYSTORE_B64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$v" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -ne 0 ] && [ "$set_count" -ne 4 ]; then
            echo "::error title=Signing secrets::Set all four secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (or none for a test build)."
            exit 1
          fi
          if [ "$set_count" -eq 4 ]; then
            trap 'rm -f app/release.keystore' EXIT
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode --ignore-garbage > app/release.keystore
            signing=(
              "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
            echo "Signing the APK with the private release key"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Test signature::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets are not set, so the APK is signed with the public React Native debug key. Use it for testing only."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a "${signing[@]}"
          # Google Play takes an .aab signed with the private upload key (all ABIs incl. x86_64 for Chromebooks/tablets)
          if [ ${#signing[@]} -gt 0 ]; then
            ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 "${signing[@]}"
          fi
      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Uroki.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/Uroki.aab; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/Uroki.*

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # RevenueCat public SDK keys (safe to ship in the app); purchases are off when unset
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
      # Expo push service project (server push); empty = push off, local reminders still work
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/Uroki.xcworkspace -scheme Uroki -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 \
            || (tail -n 250 xcodebuild.log; exit 1)
          tail -n 5 xcodebuild.log
      - name: Package IPA (unsigned, for re-signing with Sideloadly/AltStore)
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Uroki.app out/Payload/
          cd out && zip -qry Uroki-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios
          path: out/Uroki-unsigned.ipa

  release:
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: out/*
          body: |
            **Android:** скачайте `Uroki.apk` на телефон и откройте (разрешите установку из этого источника).
            **iPhone:** `Uroki-unsigned.ipa` нужно подписать своим Apple ID через Sideloadly или AltStore (бесплатный Apple ID — приложение работает 7 дней, потом переподписать).
            ${{ needs.android.outputs.signing == 'release' && 'APK подписан закрытым ключом проекта, поэтому новые версии ставятся поверх старых. Если стояла тестовая версия и установка не проходит, удалите её один раз.' || 'Это тестовая сборка: APK подписан общедоступным тестовым ключом. Версии для магазина приложений будут подписаны закрытым ключом, и тестовую версию перед их установкой нужно будет один раз удалить.' }}
