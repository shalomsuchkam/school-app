name: Build APK + IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed iOS build to TestFlight
        type: boolean
        default: false
      publish_release:
        description: Publish build artifacts as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

# A running build always finishes (several pushes in a row used to cancel every build);
# GitHub keeps only the newest waiting run, so at most one more build follows.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # UI and unit tests (jest); both builds wait for them, so a failing test fails the run before any build starts
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # RevenueCat public SDK keys (safe to ship in the app); purchases are off when unset
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
      # Expo push service project (server push); empty = push off, local reminders still work
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    outputs:
      signing: ${{ steps.apk.outputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Firebase config for push (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          signing=()
          set_count=0
          for v in "$ANDROID_KEYSTORE_B64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$v" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -ne 0 ] && [ "$set_count" -ne 4 ]; then
            echo "::error title=Signing secrets::Set all four secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (or none for a test build)."
            exit 1
          fi
          if [ "$set_count" -eq 4 ]; then
            trap 'rm -f app/release.keystore' EXIT
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode --ignore-garbage > app/release.keystore
            signing=(
              "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
            echo "Signing the APK with the private release key"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Test signature::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets are not set, so the APK is signed with the public React Native debug key. Use it for testing only."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew :screen-guard:testReleaseUnitTest assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a "${signing[@]}"
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/Uroki.apk
          # a lighter APK for 32-bit phones (Galaxy A11 and other budget models): about half the size
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a "${signing[@]}"
          cp app/build/outputs/apk/release/app-release.apk ../out/Uroki-32bit.apk
          # Google Play takes an .aab signed with the private upload key (all ABIs incl. x86_64 for Chromebooks/tablets)
          if [ ${#signing[@]} -gt 0 ]; then
            ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 "${signing[@]}"
          fi
      - run: |
          mkdir -p out
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/Uroki.aab; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/Uroki*

  # iOS: with the four Apple secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) a signed build goes to
  # TestFlight (cloud-managed signing: Xcode creates certificates and profiles through the App Store Connect API key);
  # without them an unsigned IPA for Sideloadly/AltStore, as before. The screen-time extensions are in the app only
  # when app.json has expo.extra.iosScreenTime = true (app.config.ts).
  ios:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # RevenueCat public SDK keys (safe to ship in the app); purchases are off when unset
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.RC_IOS_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
      # Expo push service project (server push); empty = push off, local reminders still work
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    outputs:
      testflight: ${{ steps.mode.outputs.signed }}
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
      - name: Signed TestFlight build or unsigned IPA
        id: mode
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_count=0
          for v in "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_P8" "$APPLE_TEAM_ID"; do
            if [ -n "$v" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -ne 0 ] && [ "$set_count" -ne 4 ]; then
            echo "::error title=Apple secrets::Set all four secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (or none for the unsigned IPA)."
            exit 1
          fi
          if [ "$set_count" -eq 4 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signed build, upload to TestFlight"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple secrets: unsigned IPA"
          fi
          node -e "const c=require('./app.json').expo.extra||{};console.log('iOS screen time (extensions):', c.iosScreenTime===true?'on':'off')"
      - run: npm ci
      - name: Prebuild
        env:
          # ios.appleTeamId for the app and the extensions (signed build only)
          APPLE_TEAM_ID: ${{ steps.mode.outputs.signed == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: npx expo prebuild --platform ios

      # ---------- no Apple secrets: unsigned IPA ----------
      - name: Build unsigned app
        if: steps.mode.outputs.signed != 'true'
        run: |
          xcodebuild -workspace ios/Uroki.xcworkspace -scheme Uroki -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 \
            || (tail -n 250 xcodebuild.log; exit 1)
          tail -n 5 xcodebuild.log
      - name: Package IPA (unsigned, for re-signing with Sideloadly/AltStore)
        if: steps.mode.outputs.signed != 'true'
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Uroki.app out/Payload/
          cd out && zip -qry Uroki-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.mode.outputs.signed != 'true'
        with:
          name: ios
          path: out/Uroki-unsigned.ipa

      # ---------- Apple secrets: signed archive -> TestFlight ----------
      - name: App Store Connect API key (temporary file)
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          dir="$RUNNER_TEMP/asc-keys"
          (umask 077 && mkdir -p "$dir" && printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey_${ASC_KEY_ID}.p8")
          chmod 600 "$dir/AuthKey_${ASC_KEY_ID}.p8"
          # altool looks for AuthKey_<id>.p8 in API_PRIVATE_KEYS_DIR
          echo "API_PRIVATE_KEYS_DIR=$dir" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive (automatic, cloud-managed signing)
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Archive unsigned and let the export step sign it for the App Store (cloud-managed distribution
          # certificate + App Store profile). Automatic signing of the archive itself would need an
          # "Apple Development" profile, which Apple only issues when the team has a registered device.
          xcodebuild -workspace ios/Uroki.xcworkspace -scheme Uroki -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Uroki.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > xcodebuild.log 2>&1 \
            || (tail -n 250 xcodebuild.log; exit 1)
          tail -n 5 xcodebuild.log
      - name: Export for App Store Connect
        if: steps.mode.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          opts="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string export" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" "$opts" > /dev/null
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Uroki.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$opts" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 \
            || (tail -n 150 export.log; exit 1)
          ls "$RUNNER_TEMP/export"
      - name: Save signed IPA as a build artifact
        if: steps.mode.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-signed
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        id: upload
        if: steps.mode.outputs.signed == 'true' && inputs.upload_testflight == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          # altool --upload-app with the API key where this Xcode still ships it; otherwise Xcode's own upload
          if xcrun --find altool > /dev/null 2>&1 && xcrun altool --help 2>&1 | grep -q -- '--upload-app'; then
            echo "Uploading with altool"
            xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          else
            echo "altool --upload-app is not available: uploading with xcodebuild -exportArchive (destination upload)"
            opts="$RUNNER_TEMP/UploadOptions.plist"
            /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
              -c "Add :destination string upload" \
              -c "Add :signingStyle string automatic" \
              -c "Add :teamID string $APPLE_TEAM_ID" \
              -c "Add :uploadSymbols bool true" \
              -c "Add :manageAppVersionAndBuildNumber bool false" "$opts" > /dev/null
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Uroki.xcarchive" \
              -exportPath "$RUNNER_TEMP/upload" -exportOptionsPlist "$opts" \
              -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          fi
          echo "Build ${BUILD_NUMBER} uploaded; it appears in TestFlight after Apple's processing (usually 5-30 min)."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/UploadOptions.plist"

  release:
    needs: [android, ios]
    if: always() && inputs.publish_release == true && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: out/*
          body: |
            **Android:** скачайте `Uroki.apk` на телефон и откройте (разрешите установку из этого источника). Для 32-битных телефонов (Samsung Galaxy A11 и подобные) есть облегчённый `Uroki-32bit.apk`.
            **iPhone:** ${{ needs.ios.outputs.uploaded == 'true' && format('сборка {0} загружена в TestFlight.', github.run_number) || needs.ios.result == 'success' && needs.ios.outputs.testflight == 'true' && 'Подписанный IPA приложен к сборке. Загрузка в TestFlight не выполнялась.' || needs.ios.outputs.testflight == 'true' && 'Сборка iOS не удалась, см. журнал задачи ios.' || '`Uroki-unsigned.ipa` нужно подписать своим Apple ID через Sideloadly или AltStore.' }}
            ${{ needs.android.outputs.signing == 'release' && 'APK подписан закрытым ключом проекта, поэтому новые версии ставятся поверх старых. Если стояла тестовая версия и установка не проходит, удалите её один раз.' || 'Это тестовая сборка: APK подписан общедоступным тестовым ключом. Версии для магазина приложений будут подписаны закрытым ключом, и тестовую версию перед их установкой нужно будет один раз удалить.' }}
