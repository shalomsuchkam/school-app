name: Apple rejection metadata repair
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
      exclude_mainland_china:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/apple-rejection-metadata.mjs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLY: ${{ inputs.apply }}
          EXCLUDE_MAINLAND_CHINA: ${{ inputs.exclude_mainland_china }}
