name: Capture actual iOS app screenshots
on:
  workflow_dispatch:
    inputs:
      simulator_run:
        description: Reuse an existing simulator app artifact from this workflow
        default: ''
        type: string
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - run: npm ci
        if: inputs.simulator_run == ''
      - run: npx expo prebuild --platform ios
        if: inputs.simulator_run == ''
      - name: Build actual simulator app
        if: inputs.simulator_run == ''
        run: |
          xcodebuild -workspace ios/Uroki.xcworkspace -scheme Uroki -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-sim \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build > simulator-build.log 2>&1 || (tail -n 180 simulator-build.log; exit 1)
          tail -n 5 simulator-build.log
          (cd build/ios-sim/Build/Products/Release-iphonesimulator && zip -qry "$RUNNER_TEMP/Uroki-simulator.zip" Uroki.app)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.simulator_run != ''
        with:
          name: ios-simulator-app
          run-id: ${{ inputs.simulator_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Restore simulator app
        if: inputs.simulator_run != ''
        run: |
          mkdir -p build/ios-sim/Build/Products/Release-iphonesimulator
          unzip -q "$RUNNER_TEMP/Uroki-simulator.zip" -d build/ios-sim/Build/Products/Release-iphonesimulator
      - name: Sign simulator app for Keychain access
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          team=os.environ['APPLE_TEAM_ID']
          assert team
          identifier=team+'.kz.uroki.app'
          with open('/tmp/simulator-entitlements.plist','wb') as f:
              plistlib.dump({'application-identifier':identifier,'com.apple.developer.team-identifier':team,'keychain-access-groups':[identifier]},f)
          PY
          codesign --force --sign - --entitlements /tmp/simulator-entitlements.plist build/ios-sim/Build/Products/Release-iphonesimulator/Uroki.app
          codesign --verify build/ios-sim/Build/Products/Release-iphonesimulator/Uroki.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/Uroki-simulator.zip
      - name: Install UI test driver
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Record app screens on iPhone and iPad
        env:
          REVIEW_CODE: ${{ secrets.STORE_REVIEW_PARENT_CODE }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          test -n "$REVIEW_CODE"
          mkdir -p screenshots
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' > /tmp/capture-devices.txt
          import json
          groups=json.load(open('/tmp/devices.json'))['devices']
          devices=[d for key,values in groups.items() if 'iOS' in key for d in values if d.get('isAvailable')]
          for label,match in [('iphone',lambda n:'iPhone' in n and 'Pro Max' in n),('ipad',lambda n:'iPad' in n and '13-inch' in n)]:
              selected=[d for d in devices if match(d['name'])]
              if not selected: raise RuntimeError('No matching device: '+label)
              print(label,selected[-1]['udid'])
          PY
          while read -r label device; do
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcrun simctl install "$device" build/ios-sim/Build/Products/Release-iphonesimulator/Uroki.app
            mkdir -p "screenshots/$label"
            "$HOME/.maestro/bin/maestro" --device "$device" test -e REVIEW_CODE="$REVIEW_CODE" -e OUTPUT="screenshots/$label" .maestro/store-screenshots.yaml
            xcrun simctl shutdown "$device"
          done < /tmp/capture-devices.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-actual-screenshots
          path: |
            screenshots/**/*.png
            simulator-build.log
            ~/.maestro/tests/**/*.png
            ~/.maestro/tests/**/*.log
          if-no-files-found: error
