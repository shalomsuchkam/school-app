name: Deploy backend

# Deploys the "app" edge function whenever its code changes on main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cmranrfjvvmhktntbnpg
    steps:
      - uses: actions/checkout@v4
      - name: Skip without a token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning title=Backend not deployed::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy the edge function automatically."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Type-check
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: deno check supabase/functions/app/index.ts
      - name: Deploy edge function "app"
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # the function does its own auth (device tokens, webhook/cron secrets), so the gateway JWT check stays off
        run: supabase functions deploy app --project-ref "$PROJECT_REF" --no-verify-jwt
