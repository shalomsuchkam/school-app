name: Location for the GitHub family

# Manual: turns «Где ребёнок» (location tracking) on or off for the first child of the newest family made by
# «Create a family», the same as the parent's toggle in Settings → «Где ребёнок». Owner tests only.
on:
  workflow_dispatch:
    inputs:
      on:
        description: Включить отслеживание
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  location:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SELFHOST_HOST }}
      SSH_USER: ${{ secrets.SELFHOST_USER }}
      SSH_KEY: ${{ secrets.SELFHOST_SSH_KEY }}
      ON: ${{ inputs.on }}
    steps:
      - name: Set track_location on the server
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          key=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if ! printf '%s' "$key" | grep -q 'PRIVATE KEY-----'; then key=$(printf '%s' "$key" | tr -d ' \n' | base64 -d | tr -d '\r'); fi
          printf '%s\n' "$key" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -T 20 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          sudo_cmd="sudo -n"; [ "$SSH_USER" = root ] && sudo_cmd=""
          val=$([ "$ON" = true ] && echo true || echo false)
          ssh -i ~/.ssh/k -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$sudo_cmd bash -s -- $val" <<'REMOTE' | tee out.txt
          set -euo pipefail
          . /opt/uroki/kit/lib.sh
          db_psql -At -v on="$1" -f - <<'SQL'
          with fam as (
            select f.id from public.app_families f
             where exists (select 1 from public.app_devices d where d.family_id = f.id and d.role = 'parent' and d.name = 'GitHub')
             order by f.created_at desc limit 1
          ), kid as (
            select c.id from public.app_children c join fam on c.family_id = fam.id order by c.pos, c.id limit 1
          )
          update public.app_children c set track_location = (:'on')::boolean
            from kid where c.id = kid.id
          returning 'child ' || c.id || ' ' || c.name || ': track_location=' || c.track_location;
          SQL
          REMOTE
          rm -f ~/.ssh/k
          grep -q '^child ' out.txt || { echo "::error::no family made by «Create a family» was found"; exit 1; }
          echo "«Где ребёнок»: $( [ "$ON" = true ] && echo включено || echo выключено )" >> "$GITHUB_STEP_SUMMARY"
