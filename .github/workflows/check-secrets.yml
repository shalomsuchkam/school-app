name: Check secrets

# Manual: shows which repository secrets are set (only "set" / "missing", never values).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SELFHOST_HOST: ${{ secrets.SELFHOST_HOST }}
          SELFHOST_USER: ${{ secrets.SELFHOST_USER }}
          SELFHOST_SSH_KEY: ${{ secrets.SELFHOST_SSH_KEY }}
          SELFHOST_SSH_KNOWN_HOSTS: ${{ secrets.SELFHOST_SSH_KNOWN_HOSTS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID \
                   ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                   SELFHOST_HOST SELFHOST_USER SELFHOST_SSH_KEY SELFHOST_SSH_KNOWN_HOSTS \
                   BACKUP_PASSPHRASE SUPABASE_DB_URL PLAY_SERVICE_ACCOUNT_JSON EXPO_PUBLIC_API_URL; do
            v=${!n}
            if [ -n "$v" ]; then
              extra=""
              case $n in
                ASC_KEY_P8) printf '%s' "$v" | grep -q 'BEGIN PRIVATE KEY' && extra=" (looks like a .p8 key)" || extra=" (WARNING: no 'BEGIN PRIVATE KEY' line)";;
                APPLE_TEAM_ID|ASC_KEY_ID) [[ "$v" =~ ^[A-Z0-9]{10}$ ]] && extra=" (format ok)" || extra=" (WARNING: expected 10 letters/digits)";;
                ASC_ISSUER_ID) [[ "$v" =~ ^[0-9a-f-]{36}$ ]] && extra=" (format ok)" || extra=" (WARNING: expected a UUID)";;
              esac
              echo "set      $n$extra"
            else
              echo "missing  $n"
            fi
          done
