name: New code for the GitHub family

# Manual: a new one-time join code (48 h) for the newest family made by «Create a family»
# (the one with the helper parent device «GitHub»), without a parent's phone. Owner tests only.
on:
  workflow_dispatch:
    inputs:
      role:
        description: Для кого код
        type: choice
        options: [child, parent]
        default: child

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SELFHOST_HOST }}
      SSH_USER: ${{ secrets.SELFHOST_USER }}
      SSH_KEY: ${{ secrets.SELFHOST_SSH_KEY }}
      ROLE: ${{ inputs.role }}
    steps:
      - name: Make the code on the server
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          key=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if ! printf '%s' "$key" | grep -q 'PRIVATE KEY-----'; then key=$(printf '%s' "$key" | tr -d ' \n' | base64 -d | tr -d '\r'); fi
          printf '%s\n' "$key" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -T 20 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          sudo_cmd="sudo -n"; [ "$SSH_USER" = root ] && sudo_cmd=""
          # 6 characters from the app's own invite alphabet style (no 0/O/1/I)
          code=$(tr -dc 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789' < /dev/urandom | head -c 6)
          ssh -i ~/.ssh/k -o BatchMode=yes "$SSH_USER@$SSH_HOST" "$sudo_cmd bash -s -- '$code' '$ROLE'" <<'REMOTE' | tee out.txt
          set -euo pipefail
          . /opt/uroki/kit/lib.sh
          db_psql -At -v code="$1" -v role="$2" -f - <<'SQL'
          with fam as (
            select f.id from public.app_families f
             where exists (select 1 from public.app_devices d where d.family_id = f.id and d.role = 'parent' and d.name = 'GitHub')
             order by f.created_at desc limit 1
          ), kid as (
            select c.id from public.app_children c join fam on c.family_id = fam.id order by c.pos, c.id limit 1
          )
          insert into public.app_invites (code, family_id, role, expires_at, child_id)
          select :'code', fam.id, :'role', now() + interval '48 hours',
                 case when :'role' = 'child' then (select id from kid) end
            from fam
          returning 'ok ' || code;
          SQL
          REMOTE
          rm -f ~/.ssh/k
          grep -q '^ok ' out.txt || { echo "::error::no family made by «Create a family» was found"; exit 1; }
          who=$([ "$ROLE" = child ] && echo "телефона ребёнка" || echo "телефона родителя")
          echo "code: $code"
          echo "## Новый код для $who: \`$code\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Действует 48 часов, один раз. В приложении: «У меня есть код» → ввести код." >> "$GITHUB_STEP_SUMMARY"
