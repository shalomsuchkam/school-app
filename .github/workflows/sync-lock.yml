# Temporary: syncs package-lock.json on this branch (the agent env had no npm registry). Delete after it runs.
name: sync-lockfile
on:
  push:
    branches: [claude/child-location]
    paths: [.github/workflows/sync-lock.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/sync-lock.yml
          git add package-lock.json
          git commit -m "chore: sync package-lock for expo-location, task-manager, background-fetch"
          git push
